name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: joaocllarindo
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=%23A855F7&color_dots=%23161B22%2C%235B21B6%2C%237C3AED%2C%238B5CF6%2C%23C084FC

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
